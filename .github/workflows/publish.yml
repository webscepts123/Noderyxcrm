name: Publish to npm

# Trusted Publishing (OIDC): npm exchanges this workflow's GitHub-issued OIDC
# token for a short-lived publish token at publish time. No NPM_TOKEN secret
# is used or needed — the trust relationship is configured on the package's
# npm "Trusted Publisher" settings page instead.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing requires npm 11.5.1+; Node 22's bundled npm may be
      # older, so pin an npm version that supports OIDC exchange.
      - run: npm install -g npm@^11.5.1

      - run: npm ci

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e 'const p = require("./package.json"); if (process.env.RELEASE_TAG.replace(/^v/, "") !== p.version) process.exit(1)'

      - run: npm publish --access public
