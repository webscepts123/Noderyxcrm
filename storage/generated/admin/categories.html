<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Categories — Noderyx CMS</title>
    <link rel="stylesheet" href="/public/cms.css">
  </head>
  <body class="admin-body">
    <div class="sidebar">
      <a href="/nodecms" class="admin-brand">Noderyx CMS</a>
      <nav class="admin-nav">
        <a href="/nodecms">Dashboard</a>
        <p class="nav-section">Content</p>
        <a href="/nodecms/posts">Posts</a>
        <a href="/nodecms/posts?type=page">Pages</a>
        <a href="/nodecms/media">Media</a>
        <a href="/nodecms/categories" class="active">Categories</a>
        <a href="/nodecms/comments">Comments</a>
        <p class="nav-section">Appearance</p>
        <a href="/nodecms/menus">Menus</a>
        <a href="/nodecms/themes">Themes</a>
        <a href="/nodecms/plugins">Plugins</a>
        <p class="nav-section">System</p>
        <a href="/nodecms/users">Users</a>
        <a href="/nodecms/backups">Backups</a>
        <a href="/nodecms/integrations">Integrations</a>
        <a href="/nodecms/settings">Settings & SEO</a>
      </nav>
    </div>
    <main class="admin-main">
      <header class="admin-top">
        <div>
          <p class="kicker">Organization</p>
          <h1>Categories</h1>
        </div>
      </header>
      <div class="two-column">
        <form method="post" action="/nodecms/categories" class="panel stack">
          <input type="hidden" name="_csrf" value="">
          <h2>Add category</h2>
          <label>Name
            <input name="name" required="">
          </label>
          <label>Slug
            <input name="slug">
          </label>
          <label>Description
            <textarea name="description" rows="4"></textarea>
          </label>
          <button type="submit" class="primary">Add category</button>
        </form>
        <section class="panel">
          <h2>All categories</h2>
          <ul class="clean-list">
          </ul>
        </section>
      </div>
    </main>
  </body>
</html>
