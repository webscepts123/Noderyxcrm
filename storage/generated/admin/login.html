<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in — Noderyx CMS</title>
    <link rel="stylesheet" href="/public/cms.css">
  </head>
  <body class="login-body">
    <main class="login-card">
      <a href="/" class="login-logo">Noderyx CMS</a>
      <h1>Welcome back</h1>
      <p class="muted">Sign in to manage your website.</p>
      <form method="post" action="/nodecms/login" class="stack">
        <input type="hidden" name="_csrf" value="">
        <label>Email
          <input type="email" name="email" required="" autocomplete="email" value="admin@example.com">
        </label>
        <label>Password
          <input type="password" name="password" required="" autocomplete="current-password">
        </label>
        <button type="submit" class="primary">Sign in</button>
      </form>
      <a href="/" class="back-link">← Back to site</a>
    </main>
  </body>
</html>
